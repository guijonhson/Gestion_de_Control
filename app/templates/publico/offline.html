<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2e7d32">
    <title>Sin conexión - AgroDev</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}?v={{ asset_version }}" rel="stylesheet">

<body class="bg-light">

            <i class="bi bi-wifi-off text-secondary" style="font-size: 4rem;" aria-hidden="true"></i>
