{% extends "base.html" %}
{% block title %}Editar Usuario - AgroDev{% endblock %}
{% block content %}
<h3 class="h4 h3-md"><i class="bi bi-person-edit"></i> Editar Usuario</h3>
<div class="card mt-3">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre del Productor</label>
                <input type="text" name="nombre_productor" maxlength="100" class="form-control" value="{{ usuario.productor.nombre if usuario.productor else '' }}" required>
                <div class="form-text">Este nombre se aplica a todos los usuarios de este productor.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre de Usuario</label>
                <input type="text" name="nombre_usuario" class="form-control" maxlength="50" autocomplete="username" value="{{ usuario.nombre_usuario }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" name="correo" class="form-control" maxlength="100" autocomplete="email" autocapitalize="none" spellcheck="false" value="{{ usuario.correo }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nueva Contraseña (dejar en blanco para mantener)</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control" minlength="8" maxlength="128" autocomplete="new-password">
                    <button class="btn btn-outline-secondary btn-mostrar-password" type="button" data-toggle-password="password" aria-label="Mostrar contraseña" aria-pressed="false"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            {% if current_user.rol == 'administrador' %}
            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select name="rol" class="form-select" required>
                    <option value="cliente" {% if usuario.rol == 'cliente' %}selected{% endif %}>Cliente</option>
                    <option value="administrador" {% if usuario.rol == 'administrador' %}selected{% endif %}>Administrador</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Estado</label>
                <select name="activo" class="form-select" required>
                    <option value="1" {% if usuario.activo %}selected{% endif %}>Activo</option>
                    <option value="0" {% if not usuario.activo %}selected{% endif %}>Inactivo</option>
                </select>
            </div>
            {% endif %}
            <div class="d-flex flex-column flex-md-row gap-2">
                <button type="submit" class="btn btn-success w-100 w-md-auto">Guardar Cambios</button>
                <a href="{{ url_for('gestion_usuarios.listar') }}" class="btn btn-secondary w-100 w-md-auto">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
