{% extends "base.html" %}
{% block title %}Iniciar Sesión - AgroDev{% endblock %}
{% block login_content %}
<div class="container">
    <div class="row justify-content-center mt-4 mt-md-5">
        <div class="col-11 col-sm-9 col-md-6 col-lg-4">
            <div class="card auth-card">
                <div class="card-body text-center p-4">
                    <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="AgroDev" class="auth-logo mb-3 img-fluid">
                    <h1 class="h5 mb-3">Iniciar sesión</h1>
                    <form method="POST">
                        <div class="mb-3 text-start">
                            <label class="form-label" for="correo">Correo</label>
                            <input type="email" id="correo" name="correo" class="form-control"
                                   value="{{ datos.get('correo', '') if datos else '' }}"
                                   maxlength="100" autocomplete="email" autocapitalize="none"
                                   spellcheck="false" required>
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label" for="password">Contraseña</label>
                            <div class="input-group">
                                <input type="password" id="password" name="password" class="form-control"
                                       maxlength="128" autocomplete="current-password" required>
                                <button class="btn btn-outline-secondary btn-mostrar-password" type="button"
                                        data-toggle-password="password" aria-label="Mostrar contraseña"
                                        aria-pressed="false"><i class="bi bi-eye"></i></button>
                            </div>
                        </div>
                        <div class="form-check text-start mb-3">
                            <input class="form-check-input" type="checkbox" name="remember" id="remember" value="1">
                            <label class="form-check-label" for="remember">Mantener sesión iniciada</label>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Iniciar Sesión</button>
                    </form>
                    <div class="text-center mt-3 d-grid gap-2">
                        <a href="{{ url_for('auth.recuperar') }}">¿Olvidaste tu contraseña?</a>
                        <a href="{{ url_for('auth.register') }}">Crear cuenta</a>
                    </div>
                </div>
            </div>
            <div class="text-center mt-3 small">
                <a href="{{ url_for('publico.planes') }}" class="me-2">Planes</a>
                <a href="{{ url_for('publico.terminos') }}" class="me-2">Términos</a>
                <a href="{{ url_for('publico.privacidad') }}">Privacidad</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
